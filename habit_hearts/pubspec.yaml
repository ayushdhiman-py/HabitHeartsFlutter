name: habit_hearts
description: A habit tracking and relationship app for couples.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  provider: ^6.1.0
  firebase_core: ^2.32.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.5
  firebase_app_check: ^0.2.2
  google_sign_in: ^5.4.4
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.1
  font_awesome_flutter: ^10.10.0
  intl: ^0.18.1
  table_calendar: ^3.0.9
  shared_preferences: ^2.2.0
  animations: ^2.0.3
  http: ^1.5.0
  flutter_slidable: ^3.1.2
  confetti: ^0.7.0
  lottie: ^3.3.2
  flutter_heatmap_calendar: ^1.0.0
  collection: ^1.18.0
  google_fonts: ^4.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700